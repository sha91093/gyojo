# =========================================================
# 沿岸漁場支援マップ 設定ファイル
# すべてのパラメータはここに集約する（ハードコード禁止）
# =========================================================

# 対象海域（守江湾・別府湾・伊予灘南部・国東半島沖・姫島周辺）
# CRS: EPSG:4326
# 別府湾が矩形端ぎりぎりだとフロント計算が湾内で破綻するため、
# 表示範囲自体も一回り広く取っている（レビュー A-3）
bbox:
  min_lon: 131.2
  max_lon: 132.6
  min_lat: 33.0
  max_lat: 34.1

# 取得時のみ bbox を四方にこの分だけ拡張する。
# フロント（Sobel）計算後に表示範囲へクリップし、
# ラスタ端の勾配破綻を表示領域に持ち込まない
bbox_buffer_deg: 0.15

sst:
  # 取得元: NOAA CoastWatch ERDDAP が再配信する MUR SST v4.1
  # （NASA JPL PO.DAAC の MUR-JPL-L4-GLOB-v4.1 と同一データ。
  #   ERDDAP はサーバー側で bbox 切り出しができ、認証不要のため
  #   日次CIに適する。詳細は README「データ取得経路について」参照）
  source: erddap
  erddap:
    base_url: https://coastwatch.pfeg.noaa.gov/erddap
    dataset_id: jplMURSST41
    variable: analysed_sst
    # 推定誤差（℃）。沿岸ピクセルの信頼度表示に使う（レビュー A-2）
    error_variable: analysis_error
    # MUR の time 座標は毎日 09:00:00Z
    time_of_day: "09:00:00Z"
  # 公開ラグ対策: 今日から最大N日遡り、取得できた最新日を採用する
  lookback_days: 7

  # 表示用カラーレンジ。色付けはブラウザ側（Canvas）で行うため、
  # ここでの設定は meta.json 経由でフロントエンドに渡される
  display:
    colormap: turbo
    # auto: その日の percentile から自動決定（フロント探しに向く）
    # fixed: 季節別の固定レンジ（日々の変化の追跡に向く）
    # どちらを初期表示にするかの既定値。閲覧者はブラウザで切替可能
    range_mode: auto
    auto_percentiles: [2, 98]
    # auto のときでも最低これだけの幅 (℃) は確保する
    min_span: 3.0
    # auto レンジの安全弁（これを超えて伸びない）
    vmin: 8.0
    vmax: 32.0
    # 固定モード用の季節別レンジ。
    # 目的は「昨日と今日を同じ色で比較する」ことなので、季節内で実際に
    # 出現する幅+αまで詰める（広すぎると全部同じ色になり比較できない。
    # 夏の実測は 23〜27℃ 程度 → 幅7℃で運用）
    # TODO: 冬レンジは暫定値。冬季に実データを見て調整すること。
    #       月別レンジ（または平年値ベース）への拡張も検討
    fixed_range:
      summer: [22.0, 29.0]   # 6-10月
      winter: [12.0, 20.0]   # 11-5月（要検証）

  # analysis_error がこの値（℃）を超えるピクセルは
  # 信頼度が低いものとして半透明表示する
  confidence:
    error_threshold_c: 0.5

# 水温フロント強度（フェーズ2 / レビュー C-1）
front:
  # 表示レンジ上限に使うパーセンタイル
  vmax_percentile: 98
  # 表示レンジ上限の下限値 (℃/km)。凪いだ日でもスケールが潰れないように
  vmax_floor: 0.1

# クロロフィルa（フェーズ2b / Copernicus Marine）
chla:
  # 取得を有効にするか。認証情報が無い環境では自動でスキップされる
  enabled: true
  # Copernicus Marine の gap-free L4（雲欠測を時空間補間で埋めた日次プロダクト）
  # 製品: OCEANCOLOUR_GLO_BGC_L4_NRT_009_102
  dataset_id: cmems_obs-oc_glo_bgc-plankton_nrt_l4-gapfree-multi-4km_P1D
  variable: CHL              # クロロフィルa濃度 (mg/m^3)
  # 公開ラグ対策。gap-free NRT は数日遅れることがあるため MUR より長めに遡る
  lookback_days: 10
  # 認証情報を渡す環境変数名（GitHub Secrets と同名。値はコミットしない）
  username_env: CMEMS_USERNAME
  password_env: CMEMS_PASSWORD
  display:
    # クロロフィルは桁で変動するため対数スケールで色付けする
    scale: log
    colormap: algae         # 貧栄養(青緑)→ブルーム(黄緑)
    # 表示レンジ (mg/m^3)。auto のとき percentile から決め、この範囲にクランプ
    range_mode: auto
    auto_percentiles: [2, 98]
    vmin: 0.05
    vmax: 20.0

# 高解像度クロロフィル（L3 OLCI 300m・晴天時のみ / レビュー課題1・2）
# SST の二層構成（広域MUR + 高解像度）と同じ思想。雲があると欠測する。
# この L3 の被覆状況を使い、広域 L4 の「補間で埋めた箇所」を判定する（課題2）
chla_hires:
  enabled: true
  # 製品: OCEANCOLOUR_GLO_BGC_L3_NRT_009_101（OLCI 300m 日次）
  dataset_id: cmems_obs-oc_glo_bgc-plankton_nrt_l3-olci-300m_P1D
  variable: CHL               # クロロフィルa濃度 (mg/m^3)
  # フロント同様の勾配。L3 に同梱されていれば取得（無ければスキップ）
  gradient_variable: CHL_gradient
  # 高解像度は欠測しやすいため広域よりさらに長めに遡る
  lookback_days: 5
  # 出力 JSON が大きくなりすぎたときの間引き（1=間引きなし）。
  # まず素直に出してサイズを実測し、必要なら 2 にする方針
  stride: 1

output:
  docs_dir: docs
  data_dir: docs/data
  # archive/YYYY-MM-DD/ の保持日数。超えた分は削除しリポジトリ肥大化を防ぐ
  archive_retention_days: 90

web:
  title: 杵築市沖 沿岸漁場支援マップ
  # 初期表示の中心とズーム
  center: [131.9, 33.55]
  zoom: 9
