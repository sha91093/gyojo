name: daily-update

on:
  schedule:
    # JST 07:00（MUR の前日データが公開済みの時間帯）
    - cron: "0 22 * * *"
    # JST 21:00（配信元の公開が遅れた日でも当日中に拾う保険。
    # 新しいデータが無ければ差分なしでコミットされない）
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "取得する観測日 (YYYY-MM-DD)。空欄なら最新日を自動取得"
        required: false
        default: ""

permissions:
  contents: write

# 手動実行と cron が重なっても二重コミットしない
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 注: copernicusmarine v2.4.1 はメタデータ(clientsConfigV1.json 等)を
      # ~/.copernicusmarine に永続キャッシュしないため actions/cache は効かない
      # （実際に「保存対象なし」警告が出た）。接続の粘りは下の env で調整する

      - name: Fetch and process satellite data
        env:
          # クロロフィル（Copernicus Marine）用。未設定ならSSTのみで続行する
          CMEMS_USERNAME: ${{ secrets.CMEMS_USERNAME }}
          CMEMS_PASSWORD: ${{ secrets.CMEMS_PASSWORD }}
          # GCOM-C 移行用（sst.source: gee のとき使用）。サービスアカウントJSON鍵。
          # フェーズ0で登録。未設定でも source:erddap の現行運用には影響しない
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          # CMEMS のメタデータ配信(s3.waw3-1.cloudferro.com)は GitHub から
          # 届かないことがある。遅いだけの時に拾えるよう接続を少し粘る
          # （取得コード側の fetch_timeout_sec と 30分ジョブ上限で暴走は防ぐ）
          COPERNICUSMARINE_HTTPS_TIMEOUT: "30"
          COPERNICUSMARINE_HTTPS_RETRIES: "2"
          # 手動実行で日付を指定した場合のみその過去日を取得（検証・穴埋め用）
          TARGET_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            echo "指定日を取得: $TARGET_DATE"
            python -m src.main --date "$TARGET_DATE"
          else
            python -m src.main
          fi

      - name: Commit and push updated data
        # このワークフローは push では起動しないためコミットループは発生しないが、
        # 将来 push トリガーを足しても安全なよう [skip ci] を付けておく
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "変更なし（データ未更新）"
          else
            git commit -m "data: update $(date -u +%F) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
