name: daily-update

on:
  schedule:
    # JST 07:00（MUR の前日データが公開済みの時間帯）
    - cron: "0 22 * * *"
    # JST 21:00（配信元の公開が遅れた日でも当日中に拾う保険。
    # 新しいデータが無ければ差分なしでコミットされない）
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 手動実行と cron が重なっても二重コミットしない
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Copernicus Marine のメタデータ/認証キャッシュを run 間で保持し、
      # 外部エンドポイントへの接続回数を減らす（修正3）
      - name: Cache copernicusmarine metadata
        uses: actions/cache@v4
        with:
          path: ~/.copernicusmarine
          key: cmems-meta-${{ runner.os }}-v1

      - name: Fetch and process satellite data
        env:
          # クロロフィル（Copernicus Marine）用。未設定ならSSTのみで続行する
          CMEMS_USERNAME: ${{ secrets.CMEMS_USERNAME }}
          CMEMS_PASSWORD: ${{ secrets.CMEMS_PASSWORD }}
          # 外部不調時に1呼び出しが5分溶けるのを防ぐ（接続15秒/リトライ1回）。
          # これ自体でも安全側だが、取得コードにもハードタイムアウトを併設している
          COPERNICUSMARINE_HTTPS_TIMEOUT: "15"
          COPERNICUSMARINE_HTTPS_RETRIES: "1"
        run: python -m src.main

      - name: Commit and push updated data
        # このワークフローは push では起動しないためコミットループは発生しないが、
        # 将来 push トリガーを足しても安全なよう [skip ci] を付けておく
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "変更なし（データ未更新）"
          else
            git commit -m "data: update $(date -u +%F) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
